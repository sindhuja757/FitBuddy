<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>FitBuddy</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<div class="container">
<h1>💪 FitBuddy</h1>
<p>Get a personalized 3-day workout plan</p>
<form action="/generate-workout" method="post" class="card">
    <label>Name:</label><input type="text" name="username" required>
    <label>User ID (remember it):</label><input type="number" name="user_id" required>
    <label>Age:</label><input type="number" name="age" required>
    <label>Weight (kg):</label><input type="number" step="0.1" name="weight" required>
    <label>Goal:</label>
    <select name="goal"><option>weight loss</option><option>muscle gain</option><option>general fitness</option></select>
    <label>Intensity:</label>
    <select name="intensity"><option>low</option><option>medium</option><option>high</option></select>
    <button type="submit">Generate Plan</button>
</form>
<p style="text-align:center"><a href="/view-all-users">View All Users (Admin)</a></p>
</div>
</body></html>
